<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Facturas · Andes Lab</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f6fb;
        --surface: #ffffff;
        --border: #e3e8f0;
        --text: #172033;
        --muted: #64708a;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --accent-soft: #eef0ff;
        --row-hover: #f7f8fc;
        --shadow: 0 1px 2px rgb(16 24 40 / 0.04), 0 8px 24px rgb(16 24 40 / 0.06);
        --paid-bg: #e7f7ee; --paid-fg: #13794a;
        --open-bg: #e8f0ff; --open-fg: #2453c9;
        --void-bg: #f1f2f5; --void-fg: #6b7280;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1320;
          --surface: #171c2b;
          --border: #262d40;
          --text: #e6e9f2;
          --muted: #8b94ab;
          --accent: #818cf8;
          --accent-hover: #a5b4fc;
          --accent-soft: #232a45;
          --row-hover: #1d2335;
          --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 8px 24px rgb(0 0 0 / 0.25);
          --paid-bg: #12301f; --paid-fg: #6ee7a8;
          --open-bg: #172446; --open-fg: #93b4ff;
          --void-bg: #242a38; --void-fg: #9aa3b5;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 960px; margin: 0 auto; padding: 40px 16px 64px; }
      header { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
      .eyebrow { margin: 0 0 4px; color: var(--muted); font-size: 13px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 28px; font-weight: 650; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
      .sprite { width: 40px; height: 40px; overflow: visible; }
      .sprite-hoja { animation: flotar 3s ease-in-out infinite; transform-origin: 24px 40px; }
      .sprite-papel { fill: var(--surface); stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
      .sprite-dobles { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
      .sprite-linea { stroke: var(--muted); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 20; stroke-dashoffset: 20; animation: escribir 3s ease-in-out infinite; }
      .sprite-linea.l2 { animation-delay: 0.2s; }
      .sprite-linea.l3 { animation-delay: 0.4s; }
      .sprite-sello { transform-box: fill-box; transform-origin: center; animation: sellar 3s ease-in-out infinite; }
      .sprite-sello circle { fill: var(--paid-bg); stroke: var(--paid-fg); stroke-width: 2; }
      .sprite-sello path { fill: none; stroke: var(--paid-fg); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      @keyframes flotar { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-4px) rotate(3deg); } }
      @keyframes escribir { 0%, 10% { stroke-dashoffset: 20; } 40%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 20; } }
      @keyframes sellar { 0%, 45% { transform: scale(0); opacity: 0; } 55% { transform: scale(1.25); opacity: 1; } 62%, 85% { transform: scale(1); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .sprite-hoja, .sprite-linea, .sprite-sello { animation: none; }
        .sprite-linea { stroke-dashoffset: 0; }
      }
      #download {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 10px 16px; border-radius: 10px;
        background: var(--accent); color: #fff; text-decoration: none; font-weight: 600;
        box-shadow: var(--shadow); transition: background 0.15s;
      }
      #download:hover { background: var(--accent-hover); }
      #download svg { width: 18px; height: 18px; }
      #download[aria-disabled="true"] { background: var(--border); color: var(--muted); box-shadow: none; cursor: not-allowed; pointer-events: none; }
      .descarga { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
      .resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 16px; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); }
      .kpi { padding: 16px 20px; }
      .kpi span { display: block; color: var(--muted); font-size: 13px; }
      .kpi strong { display: block; margin-top: 4px; font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
      .filtros { display: flex; gap: 16px; flex-wrap: wrap; padding: 16px 20px; border-bottom: 1px solid var(--border); }
      label { display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 500; }
      select, input {
        min-width: 180px; padding: 8px 12px; border-radius: 8px;
        border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit;
      }
      select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
      .tabla { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 12px 20px; text-align: left; white-space: nowrap; }
      th { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; border-bottom: 1px solid var(--border); }
      tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
      tbody tr:last-child { border-bottom: none; }
      tbody tr:hover { background: var(--row-hover); }
      td:first-child { font-weight: 600; }
      .monto, th:nth-child(4) { text-align: right; font-variant-numeric: tabular-nums; }
      .estado { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
      .estado-paid { background: var(--paid-bg); color: var(--paid-fg); }
      .estado-open { background: var(--open-bg); color: var(--open-fg); }
      .estado-void { background: var(--void-bg); color: var(--void-fg); }
      .vacio { padding: 40px 20px; text-align: center; color: var(--muted); }
      #mensaje:empty { display: none; }
      #mensaje { margin: 0 0 16px; padding: 12px 16px; border-radius: 10px; background: #fdecec; color: #b42318; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Andes Lab · Tesorería</p>
          <h1>
            Facturas
            <svg class="sprite" viewBox="0 0 48 48" aria-hidden="true">
              <g class="sprite-hoja">
                <path class="sprite-papel" d="M10 4h22l8 8v30l-4-3-4 3-4-3-4 3-4-3-4 3-4-3-2 1.5z" />
                <path class="sprite-dobles" d="M32 4v8h8" />
                <line class="sprite-linea l1" x1="15" y1="16" x2="28" y2="16" />
                <line class="sprite-linea l2" x1="15" y1="22" x2="34" y2="22" />
                <line class="sprite-linea l3" x1="15" y1="28" x2="30" y2="28" />
                <g class="sprite-sello">
                  <circle cx="33" cy="34" r="7" />
                  <path d="m29.8 34 2.2 2.2 4.2-4.4" />
                </g>
              </g>
            </svg>
          </h1>
        </div>
        <div class="descarga">
          <label>Tu nombre
            <input id="by" type="text" maxlength="80" autocomplete="name" placeholder="Para registrar la descarga" />
          </label>
          <a id="download" aria-disabled="true" title="Escribe tu nombre para descargar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            Descargar CSV
          </a>
        </div>
      </header>

      <p id="mensaje" role="alert"></p>

      <section class="resumen">
        <div class="card kpi"><span>Facturas</span><strong id="cantidad">–</strong></div>
        <div class="card kpi"><span>Total</span><strong id="total">–</strong></div>
      </section>

      <section class="card">
        <div class="filtros">
          <label>Estado
            <select id="status">
              <option value="">Todas</option>
              <option value="paid">Pagada</option>
              <option value="open">Abierta</option>
              <option value="void">Anulada</option>
            </select>
          </label>
          <label>Mes
            <input id="month" type="month" />
          </label>
        </div>
        <div class="tabla">
          <table>
            <thead>
              <tr><th>id</th><th>cliente</th><th>fecha</th><th>monto</th><th>estado</th></tr>
            </thead>
            <tbody id="filas"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script type="module">
      import { formatAmount, formatDate, queryString, statusLabel, totalAmount } from '/panel.js'

      const status = document.getElementById('status')
      const month = document.getElementById('month')
      const filas = document.getElementById('filas')
      const total = document.getElementById('total')
      const cantidad = document.getElementById('cantidad')
      const download = document.getElementById('download')
      const by = document.getElementById('by')
      const mensaje = document.getElementById('mensaje')

      function celda(texto, clase) {
        const td = document.createElement('td')
        td.textContent = texto
        if (clase) td.className = clase
        return td
      }

      function celdaEstado(estado) {
        const td = document.createElement('td')
        const badge = document.createElement('span')
        badge.className = `estado estado-${estado}`
        badge.textContent = statusLabel(estado)
        td.append(badge)
        return td
      }

      function filaVacia() {
        const tr = document.createElement('tr')
        const td = celda('No hay facturas con estos filtros.', 'vacio')
        td.colSpan = 5
        tr.append(td)
        return tr
      }

      function actualizarDescarga() {
        if (by.value.trim() === '') {
          download.removeAttribute('href')
          download.setAttribute('aria-disabled', 'true')
          download.title = 'Escribe tu nombre para descargar'
          return
        }
        download.href =
          '/api/export.csv' + queryString({ status: status.value, month: month.value, by: by.value })
        download.removeAttribute('aria-disabled')
        download.removeAttribute('title')
      }

      async function actualizar() {
        const query = queryString({ status: status.value, month: month.value })
        actualizarDescarga()
        mensaje.textContent = ''
        try {
          const res = await fetch('/api/invoices' + query)
          if (!res.ok) throw new Error(`HTTP ${res.status}`)
          const facturas = await res.json()
          filas.replaceChildren(
            ...(facturas.length === 0
              ? [filaVacia()]
              : facturas.map((factura) => {
                  const tr = document.createElement('tr')
                  tr.append(
                    celda(factura.id),
                    celda(factura.client),
                    celda(formatDate(factura.issuedAt)),
                    celda(formatAmount(factura.amount), 'monto'),
                    celdaEstado(factura.status),
                  )
                  return tr
                })),
          )
          total.textContent = formatAmount(totalAmount(facturas))
          cantidad.textContent = String(facturas.length)
        } catch (err) {
          filas.replaceChildren()
          total.textContent = '–'
          cantidad.textContent = '–'
          mensaje.textContent = `No se pudieron cargar las facturas: ${err.message}`
        }
      }

      try {
        by.value = localStorage.getItem('panel-facturas-nombre') ?? ''
      } catch {}

      by.addEventListener('input', () => {
        try {
          localStorage.setItem('panel-facturas-nombre', by.value.trim())
        } catch {}
        actualizarDescarga()
      })
      status.addEventListener('change', actualizar)
      month.addEventListener('change', actualizar)
      actualizar()
    </script>
  </body>
</html>
